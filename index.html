<style>
/* ============================================================
   BUILDORA AI — DESIGN SYSTEM
   ============================================================ */
:root{
  --bg:#030817;
  --bg2:#050B1C;
  --bg3:#07112D;
  --surface:rgba(255,255,255,.035);
  --surface-2:rgba(255,255,255,.065);
  --surface-solid:#0A1330;
  --text:#F3F6FF;
  --muted:#8892B3;
  --muted-2:#5C6690;
  --cyan:#00E5FF;
  --blue:#008CFF;
  --violet:#6C3BFF;
  --purple:#B43CFF;
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.16);
  --glow:rgba(0,229,255,.28);
  --green:#22C77A;
  --red:#FF5470;
  --amber:#FFB020;
  --grad-brand:linear-gradient(95deg,var(--cyan) 0%,var(--blue) 38%,var(--violet) 72%,var(--purple) 100%);
  --grad-brand-soft:linear-gradient(95deg,rgba(0,229,255,.16),rgba(0,140,255,.16),rgba(108,59,255,.16),rgba(180,60,255,.16));
  --radius-sm:10px;
  --radius:16px;
  --radius-lg:22px;
  --radius-xl:28px;
  --shadow-glow:0 0 0 1px var(--border),0 20px 60px -20px rgba(0,140,255,.25);
  --font-display:'Plus Jakarta Sans',Inter,system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --header-h:72px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#F4F6FC;
  --bg2:#EAEEFA;
  --bg3:#E3E8FA;
  --surface:rgba(10,20,50,.035);
  --surface-2:rgba(10,20,50,.06);
  --surface-solid:#FFFFFF;
  --text:#0B1130;
  --muted:#5C6690;
  --muted-2:#8892B3;
  --border:rgba(10,20,50,.09);
  --border-strong:rgba(10,20,50,.16);
  --glow:rgba(0,140,255,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--header-h) + var(--safe-t) + 10px);}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100%;
  padding-top:var(--safe-t);
  padding-bottom:var(--safe-b);
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.02em;}
p{margin:0;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font-body);cursor:pointer;}
img{max-width:100%;display:block;}
::selection{background:var(--cyan);color:#00131a;}
.scrollbar-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.scrollbar-x::-webkit-scrollbar{height:6px;}
.scrollbar-x::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;}
.container{max-width:1360px;margin:0 auto;padding:0 20px;}
@media (min-width:1024px){.container{padding:0 40px;}}

/* Background ambience */
.bg-fx{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;background:
  radial-gradient(circle at 12% 8%,rgba(0,229,255,.14),transparent 40%),
  radial-gradient(circle at 88% 6%,rgba(180,60,255,.13),transparent 42%),
  radial-gradient(circle at 50% 100%,rgba(108,59,255,.14),transparent 55%),
  linear-gradient(180deg,var(--bg) 0%,var(--bg2) 45%,var(--bg3) 100%);
}
[data-theme="light"] .bg-fx{opacity:.55;}
.bg-fx::before{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 70% 50% at 50% 0%,#000 40%,transparent 80%);
}
[data-theme="light"] .bg-fx::before{background-image:linear-gradient(rgba(10,20,50,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(10,20,50,.04) 1px,transparent 1px);}

/* Glass surfaces */
.glass{
  background:var(--surface);
  border:1px solid var(--border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
.glass-strong{
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--border);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}
.grad-border{position:relative;border-radius:var(--radius);}
.grad-border::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:var(--grad-brand-soft);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;opacity:.8;
}
.grad-text{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent;}

/* Focus visibility */
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px;
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

/* ---------- Header ---------- */
.site-header{
  position:sticky;top:0;z-index:60;height:var(--header-h);
  display:flex;align-items:center;
  border-bottom:1px solid var(--border);
}
.header-inner{display:flex;align-items:center;gap:18px;width:100%;}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand-mark{width:38px;height:38px;border-radius:11px;overflow:hidden;box-shadow:0 0 0 1px var(--border-strong),0 0 22px -4px var(--glow);flex-shrink:0;}
.brand-mark img{width:100%;height:100%;object-fit:cover;}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;}
.brand-name .ai{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-tagline{font-size:10.5px;color:var(--muted);white-space:nowrap;display:none;}
@media(min-width:640px){.brand-tagline{display:block;}}
.main-nav{display:none;align-items:center;gap:4px;}
@media(min-width:900px){.main-nav{display:flex;}}
.nav-link{padding:9px 14px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--muted);transition:.18s;white-space:nowrap;}
.nav-link:hover{color:var(--text);background:var(--surface-2);}
.nav-link.active{color:var(--text);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);}
.header-search{display:none;flex:1;max-width:340px;margin:0 4px;}
@media(min-width:900px){.header-search{display:block;}}
.header-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0;}
.icon-btn{
  width:40px;height:40px;border-radius:11px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--text);transition:.18s;flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-2);border-color:var(--border-strong);}
.icon-btn svg{width:19px;height:19px;}
.mobile-search-trigger,.hamburger-btn{display:flex;}
@media(min-width:900px){.mobile-search-trigger,.hamburger-btn{display:none;}}

/* search input */
.search-wrap{position:relative;}
.search-input{
  width:100%;height:42px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:14px;padding:0 14px 0 40px;
  transition:.18s;font-family:var(--font-body);
}
.search-input::placeholder{color:var(--muted-2);}
.search-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.14),0 0 24px -4px var(--glow);outline:none;}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;height:17px;pointer-events:none;}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;border:none;background:transparent;color:var(--muted);display:none;align-items:center;justify-content:center;}
.search-clear.show{display:flex;}
.search-clear:hover{background:var(--surface-2);color:var(--text);}
.search-dropdown{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:var(--surface-solid);border:1px solid var(--border-strong);border-radius:var(--radius);
  box-shadow:0 24px 60px -16px rgba(0,0,0,.55);overflow:hidden;z-index:80;
  max-height:70vh;overflow-y:auto;
}
.search-dropdown.hidden{display:none;}
.sd-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);transition:.15s;}
.sd-item:last-child{border-bottom:none;}
.sd-item:hover,.sd-item:active{background:var(--surface-2);}
.sd-icon{width:38px;height:38px;border-radius:10px;flex-shrink:0;overflow:hidden;}
.sd-icon img{width:100%;height:100%;object-fit:cover;}
.sd-name{font-weight:700;font-size:13.5px;}
.sd-cat{font-size:11.5px;color:var(--muted);}
.sd-empty{padding:20px 14px;text-align:center;color:var(--muted);font-size:13.5px;}
.sd-admin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;background:linear-gradient(120deg,rgba(0,229,255,.08),rgba(180,60,255,.08));}
.sd-admin-title{font-weight:800;font-size:14px;font-family:var(--font-display);}
.sd-admin-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}

/* Mobile search overlay */
.mobile-search-overlay{
  position:fixed;inset:0;z-index:120;background:var(--bg);padding:calc(14px + var(--safe-t)) 16px 16px;
  display:none;flex-direction:column;
}
.mobile-search-overlay.open{display:flex;}
.mso-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.mso-list{flex:1;overflow-y:auto;}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:11px;font-weight:700;font-size:13.5px;padding:10px 18px;min-height:40px;
  border:1px solid var(--border);cursor:pointer;transition:.18s;white-space:nowrap;font-family:var(--font-body);
}
.btn svg{width:15px;height:15px;}
.btn-primary{
  background:var(--grad-brand);color:#00131a;border:none;
  box-shadow:0 8px 24px -8px rgba(0,140,255,.5);
}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-ghost{background:var(--surface);color:var(--text);}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border-strong);}
.btn-outline{background:transparent;color:var(--cyan);border:1px solid rgba(0,229,255,.4);}
.btn-outline:hover{background:rgba(0,229,255,.08);}
.btn-danger{background:rgba(255,84,112,.12);color:var(--red);border:1px solid rgba(255,84,112,.35);}
.btn-danger:hover{background:rgba(255,84,112,.2);}
.btn-block{width:100%;}
.btn-sm{padding:7px 13px;font-size:12.5px;min-height:34px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- Hero ---------- */
.hero-section{padding:26px 0 40px;}
.hero-card{
  position:relative;border-radius:var(--radius-xl);overflow:hidden;
  background:linear-gradient(135deg,var(--bg3),var(--bg2));
  border:1px solid var(--border);padding:34px 24px;
  box-shadow:var(--shadow-glow);
}
.hero-card::before{
  content:'';position:absolute;top:-40%;right:-20%;width:70%;height:180%;
  background:radial-gradient(circle,rgba(180,60,255,.22),transparent 60%);pointer-events:none;
}
.hero-card::after{
  content:'';position:absolute;bottom:-50%;left:-10%;width:60%;height:150%;
  background:radial-gradient(circle,rgba(0,229,255,.18),transparent 60%);pointer-events:none;
}
.hero-grid{position:relative;z-index:1;display:grid;gap:26px;align-items:center;}
@media(min-width:900px){.hero-grid{grid-template-columns:1.15fr .85fr;}}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--cyan);font-weight:700;margin-bottom:14px;}
.hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);}
.hero-title{font-size:clamp(30px,6vw,54px);font-weight:800;line-height:1.02;margin-bottom:12px;}
.hero-slogan{font-size:clamp(15px,2.4vw,19px);font-weight:600;color:var(--text);margin-bottom:6px;}
.hero-desc{font-size:14.5px;color:var(--muted);margin-bottom:22px;max-width:480px;}
.hero-search{max-width:520px;}
.hero-search .search-input{height:52px;border-radius:15px;font-size:15px;padding-left:48px;}
.hero-search .search-icon{left:16px;width:19px;height:19px;}
.hero-visual{display:none;position:relative;align-items:center;justify-content:center;}
@media(min-width:900px){.hero-visual{display:flex;}}
.hero-logo-orb{
  width:230px;height:230px;border-radius:34px;position:relative;
  box-shadow:0 0 0 1px var(--border-strong),0 0 80px -10px var(--glow),0 0 160px -30px rgba(180,60,255,.5);
  overflow:hidden;animation:orbFloat 6s ease-in-out infinite;
}
.hero-logo-orb img{width:100%;height:100%;object-fit:cover;}
@keyframes orbFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}

/* ---------- Section headings ---------- */
.section{padding:34px 0;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px;}
.section-title{font-size:clamp(19px,2.4vw,24px);font-weight:800;}
.section-link{font-size:13px;color:var(--cyan);font-weight:700;white-space:nowrap;}
.section-link:hover{text-decoration:underline;}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;}
.chip{flex-shrink:0;padding:8px 15px;border-radius:100px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);transition:.16s;}
.chip:hover{border-color:var(--border-strong);color:var(--text);}
.chip.active{background:var(--grad-brand);color:#00131a;border-color:transparent;}

/* ---------- App grid & cards ---------- */
.app-grid{display:grid;gap:16px;grid-template-columns:repeat(2,1fr);}
@media(min-width:560px){.app-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:860px){.app-grid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:1150px){.app-grid{grid-template-columns:repeat(5,1fr);}}
.app-card{
  position:relative;border-radius:var(--radius);padding:16px;
  background:var(--surface);border:1px solid var(--border);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
  display:flex;flex-direction:column;gap:10px;
}
.app-card:hover{transform:translateY(-4px);border-color:rgba(0,229,255,.35);box-shadow:0 18px 40px -18px rgba(0,140,255,.35),0 0 0 1px rgba(0,229,255,.15);}
.app-icon{width:52px;height:52px;border-radius:14px;overflow:hidden;flex-shrink:0;box-shadow:0 0 0 1px var(--border);}
.app-icon img{width:100%;height:100%;object-fit:cover;}
.app-icon.letter{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:20px;color:#fff;}
.app-name{font-size:15px;font-weight:700;line-height:1.2;}
.app-cat{font-size:11.5px;color:var(--cyan);font-weight:600;margin-top:1px;}
.app-desc{font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;}
.app-card-actions{display:flex;gap:8px;margin-top:2px;}
.app-card-actions .btn{flex:1;padding:8px 10px;font-size:12px;min-height:36px;}
.skel{border-radius:var(--radius);background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.skel-card{height:210px;}

/* categories grid */
.cat-grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);}
@media(min-width:560px){.cat-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.cat-grid{grid-template-columns:repeat(5,1fr);}}
.cat-card{
  display:flex;align-items:center;gap:10px;padding:14px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border);transition:.18s;
}
.cat-card:hover{border-color:rgba(108,59,255,.4);background:var(--surface-2);transform:translateY(-2px);}
.cat-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--grad-brand-soft);color:var(--cyan);flex-shrink:0;}
.cat-icon svg{width:18px;height:18px;}
.cat-name{font-size:13px;font-weight:700;}

/* empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 20px;color:var(--muted);gap:14px;}
.empty-orb{width:74px;height:74px;border-radius:22px;background:var(--grad-brand-soft);display:flex;align-items:center;justify-content:center;color:var(--cyan);}
.empty-orb svg{width:32px;height:32px;}
.empty-title{font-size:16px;font-weight:700;color:var(--text);font-family:var(--font-display);}
.empty-sub{font-size:13.5px;max-width:320px;}

/* ---------- App details page ---------- */
.app-detail-head{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;margin-bottom:28px;}
.app-detail-icon{width:96px;height:96px;border-radius:22px;overflow:hidden;box-shadow:0 0 0 1px var(--border-strong),0 20px 50px -18px var(--glow);flex-shrink:0;}
.app-detail-icon img{width:100%;height:100%;object-fit:cover;}
.app-detail-icon.letter{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:34px;color:#fff;}
.app-detail-info{flex:1;min-width:200px;}
.app-detail-name{font-size:clamp(22px,3.4vw,30px);font-weight:800;margin-bottom:5px;}
.app-detail-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:100px;background:var(--surface-2);border:1px solid var(--border);color:var(--cyan);}
.app-detail-short{color:var(--muted);font-size:14px;max-width:520px;}
.app-detail-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.detail-section-title{font-size:16px;font-weight:800;margin:26px 0 12px;font-family:var(--font-display);}
.app-detail-desc{color:var(--muted);font-size:14px;line-height:1.7;max-width:720px;white-space:pre-line;}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.tag{font-size:11.5px;padding:5px 11px;border-radius:100px;background:var(--surface);border:1px solid var(--border);color:var(--muted);}

/* gallery */
.gallery-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;}
.gallery-row.grid-desktop{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;}
@media(max-width:759px){.gallery-row.grid-desktop{display:flex;overflow-x:auto;}}
.gallery-thumb{flex-shrink:0;width:230px;height:150px;border-radius:14px;overflow:hidden;border:1px solid var(--border);cursor:pointer;position:relative;transition:.18s;}
.gallery-row.grid-desktop .gallery-thumb{width:100%;height:180px;}
.gallery-thumb:hover{border-color:rgba(0,229,255,.4);transform:scale(1.02);}
.gallery-thumb img{width:100%;height:100%;object-fit:cover;}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(2,5,15,.94);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);touch-action:none;}
.lightbox.open{display:flex;}
.lightbox-img-wrap{max-width:min(92vw,900px);max-height:80vh;display:flex;align-items:center;justify-content:center;}
.lightbox img{max-width:100%;max-height:80vh;border-radius:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);object-fit:contain;}
.lightbox-close{position:absolute;top:calc(18px + var(--safe-t));right:18px;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--border-strong);color:#fff;display:flex;align-items:center;justify-content:center;}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--border-strong);color:#fff;display:flex;align-items:center;justify-content:center;}
.lightbox-prev{left:14px;}.lightbox-next{right:14px;}
.lightbox-counter{position:absolute;bottom:calc(18px + var(--safe-b));left:50%;transform:translateX(-50%);font-size:12.5px;color:#cfd6f5;background:rgba(255,255,255,.08);padding:5px 12px;border-radius:100px;}

/* Toast */
.toast-stack{position:fixed;bottom:calc(90px + var(--safe-b));right:18px;left:18px;z-index:300;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none;}
@media(min-width:640px){.toast-stack{left:auto;bottom:calc(24px + var(--safe-b));}}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:13px;
  background:var(--surface-solid);border:1px solid var(--border-strong);box-shadow:0 18px 40px -14px rgba(0,0,0,.5);
  font-size:13.5px;font-weight:600;max-width:340px;animation:toastIn .25s ease;
}
.toast.err{border-color:rgba(255,84,112,.4);}
.toast .t-icon{width:20px;height:20px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(34,199,122,.18);color:var(--green);}
.toast.err .t-icon{background:rgba(255,84,112,.18);color:var(--red);}
.toast .t-icon svg{width:12px;height:12px;}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(2,5,15,.72);z-index:250;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal-box{
  width:100%;max-width:420px;background:var(--surface-solid);border:1px solid var(--border-strong);
  border-radius:var(--radius-lg);padding:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:modalIn .2s ease;
  max-height:88vh;overflow-y:auto;
}
.modal-box.wide{max-width:640px;}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-title{font-size:18px;font-weight:800;margin-bottom:6px;font-family:var(--font-display);}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:18px;}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-actions .btn{flex:1;}
.field-group{margin-bottom:14px;}
.field-label{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;display:block;}
.field-input,.field-select,.field-textarea{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:11px;
  color:var(--text);padding:11px 13px;font-size:14px;font-family:var(--font-body);transition:.16s;
}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.12);outline:none;}
.field-textarea{resize:vertical;min-height:80px;line-height:1.5;}
.field-error{font-size:12px;color:var(--red);margin-top:5px;display:none;}
.field-error.show{display:block;}
.field-input.invalid{border-color:var(--red);}
.pw-error-msg{font-size:12.5px;color:var(--red);margin-top:8px;display:none;}
.pw-error-msg.show{display:block;}

/* toggle switch */
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.switch{position:relative;width:46px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch-track{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:100px;transition:.18s;cursor:pointer;}
.switch-track::before{content:'';position:absolute;width:20px;height:20px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.switch input:checked + .switch-track{background:var(--grad-brand);}
.switch input:checked + .switch-track::before{transform:translateX(20px);}

/* theme toggle */
.theme-toggle{position:relative;}
.theme-toggle svg{position:absolute;transition:.2s;}
.theme-toggle .i-sun{opacity:0;transform:scale(.5) rotate(45deg);}
.theme-toggle .i-moon{opacity:1;transform:scale(1) rotate(0);}
[data-theme="light"] .theme-toggle .i-sun{opacity:1;transform:scale(1) rotate(0);}
[data-theme="light"] .theme-toggle .i-moon{opacity:0;transform:scale(.5) rotate(-45deg);}

/* mobile bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:70;display:flex;
  padding:9px 6px calc(9px + var(--safe-b));border-top:1px solid var(--border);
  background:var(--surface-solid);backdrop-filter:blur(20px);
}
@media(min-width:900px){.bottom-nav{display:none;}}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;padding:5px 0;border-radius:10px;transition:.15s;}
.bn-item svg{width:20px;height:20px;}
.bn-item.active{color:var(--cyan);}
body.has-bottom-nav{padding-bottom:calc(72px + var(--safe-b));}

/* mobile drawer menu */
.drawer-overlay{position:fixed;inset:0;background:rgba(2,5,15,.6);z-index:110;display:none;}
.drawer-overlay.open{display:block;}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(78vw,300px);background:var(--surface-solid);
  border-left:1px solid var(--border-strong);z-index:111;transform:translateX(100%);transition:transform .25s ease;
  padding:calc(20px + var(--safe-t)) 20px 20px;display:flex;flex-direction:column;gap:6px;
}
.drawer.open{transform:translateX(0);}
.drawer-link{padding:13px 12px;border-radius:11px;font-weight:700;font-size:15px;color:var(--text);}
.drawer-link:hover{background:var(--surface-2);}
.drawer-close{align-self:flex-end;margin-bottom:8px;}

/* ---------- Admin ---------- */
.admin-shell{display:grid;min-height:calc(100vh - var(--header-h) - var(--safe-t));}
@media(min-width:960px){.admin-shell{grid-template-columns:250px 1fr;}}
.admin-sidebar{
  display:none;border-right:1px solid var(--border);padding:22px 14px;
  position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));
}
@media(min-width:960px){.admin-sidebar{display:flex;flex-direction:column;}}
.admin-side-brand{font-family:var(--font-display);font-weight:800;font-size:14px;padding:0 10px 18px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.admin-side-link{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted);margin-bottom:2px;}
.admin-side-link svg{width:17px;height:17px;flex-shrink:0;}
.admin-side-link:hover{color:var(--text);background:var(--surface);}
.admin-side-link.active{color:var(--text);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);}
.admin-side-link.danger{margin-top:auto;color:var(--red);}
.admin-side-link.danger:hover{background:rgba(255,84,112,.1);}
.admin-main{padding:22px 16px 90px;}
@media(min-width:960px){.admin-main{padding:30px 34px 60px;}}
.admin-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;}
.admin-mobile-menu{display:flex;}
@media(min-width:960px){.admin-mobile-menu{display:none;}}

.stat-grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);margin-bottom:26px;}
@media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{padding:18px;border-radius:var(--radius);position:relative;overflow:hidden;}
.stat-card::after{content:'';position:absolute;inset:0;background:var(--grad-brand-soft);opacity:.5;pointer-events:none;}
.stat-num{font-size:28px;font-weight:800;font-family:var(--font-display);position:relative;z-index:1;}
.stat-label{font-size:12.5px;color:var(--muted);margin-top:3px;position:relative;z-index:1;}

.admin-panel{border-radius:var(--radius-lg);padding:20px;margin-bottom:22px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.panel-title{font-size:16px;font-weight:800;font-family:var(--font-display);}

.admin-table{width:100%;border-collapse:collapse;}
.admin-table th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--border);}
.admin-table td{padding:11px 10px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
.admin-table tr:last-child td{border-bottom:none;}
.at-app{display:flex;align-items:center;gap:10px;}
.at-icon{width:34px;height:34px;border-radius:9px;overflow:hidden;flex-shrink:0;}
.at-icon img{width:100%;height:100%;object-fit:cover;}
.at-icon.letter{display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;}
.status-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;}
.status-pill.pub{background:rgba(34,199,122,.15);color:var(--green);}
.status-pill.draft{background:rgba(255,176,32,.15);color:var(--amber);}
.row-actions{display:flex;gap:6px;}
.at-actions-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted);}
.at-actions-btn:hover{color:var(--text);background:var(--surface-2);}
.at-actions-btn svg{width:14px;height:14px;}
.admin-table-mobile{display:flex;flex-direction:column;gap:10px;}
.atm-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);}
.atm-info{flex:1;min-width:0;}
.atm-name{font-weight:700;font-size:14px;}
.atm-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}

/* image uploader */
.icon-upload{display:flex;align-items:center;gap:14px;}
.icon-preview{width:76px;height:76px;border-radius:16px;overflow:hidden;border:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surface);flex-shrink:0;}
.icon-preview img{width:100%;height:100%;object-fit:cover;}
.shot-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));margin-top:10px;}
.shot-item{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1/1;border:1px solid var(--border);background:var(--surface);}
.shot-item img{width:100%;height:100%;object-fit:cover;}
.shot-remove{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:7px;background:rgba(0,0,0,.6);border:none;color:#fff;display:flex;align-items:center;justify-content:center;}
.shot-remove svg{width:12px;height:12px;}
.shot-order{position:absolute;bottom:5px;left:5px;display:flex;gap:3px;}
.shot-order button{width:20px;height:20px;border-radius:6px;background:rgba(0,0,0,.6);border:none;color:#fff;display:flex;align-items:center;justify-content:center;}
.shot-order svg{width:11px;height:11px;}
.shot-add-btn{border-radius:12px;border:1px dashed var(--border-strong);aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11px;background:var(--surface);}
.shot-add-btn:hover{color:var(--cyan);border-color:var(--cyan);}
.shot-add-btn svg{width:18px;height:18px;}
.shot-count{font-size:11.5px;color:var(--muted);margin-top:8px;}

/* preview modal app card */
.preview-frame{border-radius:var(--radius-lg);padding:22px;background:var(--surface-2);border:1px solid var(--border);}

/* login gate */
.gate-wrap{min-height:calc(100vh - var(--header-h));display:flex;align-items:center;justify-content:center;padding:30px 16px;}
.gate-card{max-width:380px;width:100%;padding:30px 26px;border-radius:var(--radius-xl);text-align:center;}
.gate-icon{width:60px;height:60px;border-radius:16px;overflow:hidden;margin:0 auto 16px;box-shadow:0 0 0 1px var(--border-strong),0 0 40px -8px var(--glow);}
.gate-icon img{width:100%;height:100%;object-fit:cover;}

/* utility */
.mt-0{margin-top:0;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.hidden{display:none !important;}
.footer{padding:30px 0 20px;text-align:center;color:var(--muted-2);font-size:12px;border-top:1px solid var(--border);margin-top:20px;}
</style>
</head>

function $(sel, el){ return (el||document).querySelector(sel); }
function $all(sel, el){ return Array.prototype.slice.call((el||document).querySelectorAll(sel)); }
function esc(str){
  if(str==null) return '';
  return String(str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function uid(){ return 'a_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function slugify(s){ return String(s).toLowerCase().replace(/[^a-z0-9а-я]+/gi,'-').replace(/^-+|-+$/g,''); }
function isValidUrl(u){
  try{
    var url = new URL(u);
    return (url.protocol === 'http:' || url.protocol === 'https:');
  }catch(e){ return false; }
}
function fmtDate(ts){
  var d = new Date(ts);
  var pad = function(n){ return String(n).padStart(2,'0'); };
  return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
}
function debounce(fn, ms){
  var t;
  return function(){
    var args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(ctx,args); }, ms);
  };
}

/* letter-tile color pairs for apps without a custom icon */
var LETTER_GRADIENTS = [
  ['#00E5FF','#008CFF'],
  ['#008CFF','#6C3BFF'],
  ['#6C3BFF','#B43CFF'],
  ['#B43CFF','#FF5470'],
  ['#22C77A','#00C2D6'],
  ['#FFB020','#FF5470']
];
function gradientFor(seed){
  var sum = 0;
  for(var i=0;i<seed.length;i++) sum += seed.charCodeAt(i);
  return LETTER_GRADIENTS[sum % LETTER_GRADIENTS.length];
}
function appIconHtml(app, size){
  size = size || 52;
  if(app.iconUrl){
    return '<img src="'+app.iconUrl+'" alt="'+esc(app.name)+'" loading="lazy">';
  }
  var g = gradientFor(app.name||'A');
  var letter = (app.name||'?').trim().charAt(0).toUpperCase();
  return '<div class="letter" style="width:100%;height:100%;background:linear-gradient(135deg,'+g[0]+','+g[1]+');font-size:'+Math.round(size*0.42)+'px;">'+esc(letter)+'</div>';
}
var CATEGORY_ICONS = {
  social:'👥', chat:'💬', games:'🎮', finance:'💰', education:'🎓',
  music:'🎵', video:'🎬', tools:'🛠️', business:'💼', ai:'🤖', other:'➕'
};
function categoryIcon(catId){ return CATEGORY_ICONS[catId] || '🔷'; }
function categoryName(catId){
  var c = STATE.categories.find(function(c){ return c.id===catId; });
  return c ? c.name : 'Другое';
}

  el.className = 'toast' + (type==='err' ? ' err' : '');
  var iconSvg = type==='err'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
  el.innerHTML = '<span class="t-icon">'+iconSvg+'</span><span>'+esc(msg)+'</span>';
  stack.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'opacity .25s,transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(function(){ el.remove(); }, 260);
  }, 3200);
}

function searchApps(query, includeDrafts){
  var q = (query||'').trim().toLowerCase();
  if(!q) return [];
  return STATE.apps.filter(function(a){
    if(!includeDrafts && !a.published) return false;
    var hay = [a.name, a.shortDescription, a.description, categoryName(a.category)].concat(a.tags||[]).join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  });
}
function publishedApps(){ return STATE.apps.filter(function(a){ return a.published; }); }

function renderSearchDropdownHtml(query){
  var q = (query||'').trim();
  if(!q) return '';
  if(q === ADMIN_TRIGGER){
    return '<div class="sd-admin">'+
      '<div><div class="sd-admin-title">BUILDORA AI ADMIN</div><div class="sd-admin-sub">Панель администратора</div></div>'+
      '<button class="btn btn-primary btn-sm" id="sd-admin-login">ВОЙТИ</button>'+
    '</div>';
  }
  var results = searchApps(q).slice(0,6);
  if(!results.length){
    return '<div class="sd-empty">Приложение не найдено</div>';
  }
  return results.map(function(a){
    return '<a href="#app/'+a.id+'" class="sd-item" data-link>'+
      '<span class="sd-icon">'+appIconHtml(a)+'</span>'+
      '<span><span class="sd-name">'+esc(a.name)+'</span><br><span class="sd-cat">'+esc(categoryName(a.category))+'</span></span>'+
    '</a>';
  }).join('');
}
function wireSearchInputs(){
  var header = $('#header-search-input'), dd = $('#header-search-dropdown'), clearBtn = $('#header-search-clear');
  function onHeaderInput(){
    var v = header.value;
    clearBtn.classList.toggle('show', !!v);
    if(!v.trim()){ dd.classList.add('hidden'); dd.innerHTML=''; return; }
    dd.innerHTML = renderSearchDropdownHtml(v);
    dd.classList.remove('hidden');
    var loginBtn = $('#sd-admin-login', dd);
    if(loginBtn) loginBtn.onclick = function(){ dd.classList.add('hidden'); openAdminLoginModal(); };
  }
  header.addEventListener('input', onHeaderInput);
  header.addEventListener('focus', onHeaderInput);
  header.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      var v = header.value.trim();
      dd.classList.add('hidden');
      if(v === ADMIN_TRIGGER){ openAdminLoginModal(); return; }
      if(v) navigate('#search?q=' + encodeURIComponent(v));
    }else if(e.key === 'Escape'){ dd.classList.add('hidden'); header.blur(); }
  });
  clearBtn.addEventListener('click', function(){ header.value=''; dd.classList.add('hidden'); clearBtn.classList.remove('show'); header.focus(); });
  document.addEventListener('click', function(e){
    if(!dd.contains(e.target) && e.target !== header) dd.classList.add('hidden');
  });

  /* mobile search overlay */
  var mBtn = $('#mobile-search-btn'), overlay = $('#mobile-search-overlay'), mInput = $('#mobile-search-input'), mClose = $('#mobile-search-close'), mList = $('#mobile-search-list');
  mBtn.addEventListener('click', function(){ overlay.classList.add('open'); mInput.value=''; mList.innerHTML=''; setTimeout(function(){ mInput.focus(); },50); });
  mClose.addEventListener('click', function(){ overlay.classList.remove('open'); });
  function onMobileInput(){
    var v = mInput.value;
    if(!v.trim()){ mList.innerHTML=''; return; }
    mList.innerHTML = renderSearchDropdownHtml(v);
    var loginBtn = $('#sd-admin-login', mList);
    if(loginBtn) loginBtn.onclick = function(){ overlay.classList.remove('open'); openAdminLoginModal(); };
  }
  mInput.addEventListener('input', onMobileInput);
  mInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      var v = mInput.value.trim();
      if(v === ADMIN_TRIGGER){ overlay.classList.remove('open'); openAdminLoginModal(); return; }
      if(v){ overlay.classList.remove('open'); navigate('#search?q=' + encodeURIComponent(v)); }
    }
  });
}

/* ---------------------------------------------------------
   9. ROUTER
   --------------------------------------------------------- */
function parseHash(){
  var raw = location.hash.replace(/^#/, '') || 'home';
  var q = '';
  if(raw.indexOf('?') !== -1){
    var parts = raw.split('?');
    raw = parts[0];
    q = parts[1] || '';
  }
  var segs = raw.split('/').filter(Boolean);
  return { name: segs[0] || 'home', param: segs[1] || null, sub: segs[2] || null, query: q };
}
function navigate(hash){ location.hash = hash; }
window.addEventListener('hashchange', route);

function setActiveNav(routeName){
  $all('[data-route]').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-route') === routeName);
  });
}

function route(){
  window.scrollTo(0,0);
  closeDrawer();
  var r = parseHash();
  STATE.route = r;
  var view = $('#view');
  var mainRoutes = ['home','apps','categories'];
  setActiveNav(mainRoutes.indexOf(r.name) !== -1 ? r.name : '');
  document.body.classList.toggle('has-bottom-nav', mainRoutes.indexOf(r.name) !== -1 || r.name==='search');
  $('#bottom-nav').style.display = (r.name==='admin') ? 'none' : '';

  view.innerHTML = skeletonForRoute(r.name);
  setTimeout(function(){
    try{
      if(r.name === 'admin'){
        renderAdminArea(view, r);
      }else if(r.name === 'app' && r.param){
        renderAppDetail(view, r.param);
      }else if(r.name === 'category' && r.param){
        renderCategoryPage(view, r.param);
      }else if(r.name === 'search'){
        var qp = new URLSearchParams(r.query);
        renderSearchPage(view, qp.get('q') || '');
      }else if(r.name === 'apps'){
        renderAppsPage(view);
      }else if(r.name === 'categories'){
        renderCategoriesPage(view);
      }else{
        renderHome(view);
      }
      document.title = pageTitle(r);
    }catch(err){
      console.error(err);
      view.innerHTML = emptyState('⚠️','Что-то пошло не так','Попробуйте вернуться на главную страницу.', '#home','На главную');
    }
    if(window.lucide) window.lucide.createIcons();
  }, 260);
}
function pageTitle(r){
  if(r.name==='app' && r.param){
    var a = STATE.apps.find(function(x){ return x.id===r.param; });
    if(a) return a.name + ' — BUILDORA AI';
  }
  if(r.name==='admin') return 'Admin — BUILDORA AI';
  if(r.name==='search') return 'Поиск — BUILDORA AI';
  if(r.name==='categories') return 'Категории — BUILDORA AI';
  if(r.name==='apps') return 'Приложения — BUILDORA AI';
  return 'BUILDORA AI — Создавай. Развивай. Запускай.';
}
function skeletonForRoute(name){
  if(name==='admin') return '<div class="container" style="padding-top:24px;"><div class="skel" style="height:60px;border-radius:16px;margin-bottom:16px;"></div><div class="skel" style="height:200px;border-radius:16px;"></div></div>';
  if(name==='app') return '<div class="container" style="padding-top:26px;"><div class="skel" style="height:120px;border-radius:22px;margin-bottom:26px;"></div><div class="skel" style="height:240px;border-radius:16px;"></div></div>';

    dd.innerHTML = renderSearchDropdownHtml(v);
    dd.classList.remove('hidden');
    var loginBtn = $('#sd-admin-login', dd);
    if(loginBtn) loginBtn.onclick = function(){ dd.classList.add('hidden'); openAdminLoginModal(); };
  });
  input.addEventListener('keydown', function(e){

/* ---------------------------------------------------------
   17. GALLERY & LIGHTBOX
   --------------------------------------------------------- */
function wireGallery(container, shots){
  $all('.gallery-thumb', container).forEach(function(el){
    el.addEventListener('click', function(){ openLightbox(shots, parseInt(el.getAttribute('data-idx'),10)); });
  });
}
function openLightbox(shots, index){
  STATE.lightbox = { shots: shots, index: index };
  $('#lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderLightboxImg();
}
function closeLightbox(){
  $('#lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function renderLightboxImg(){
  var lb = STATE.lightbox;
  $('#lightbox-img').src = lb.shots[lb.index];
  $('#lightbox-counter').textContent = (lb.index+1) + ' / ' + lb.shots.length;
}
function lightboxNav(dir){
  var lb = STATE.lightbox;
  lb.index = (lb.index + dir + lb.shots.length) % lb.shots.length;
  renderLightboxImg();
}
function wireLightboxControls(){
  $('#lightbox-close').addEventListener('click', closeLightbox);
  $('#lightbox-prev').addEventListener('click', function(){ lightboxNav(-1); });
  $('#lightbox-next').addEventListener('click', function(){ lightboxNav(1); });
  $('#lightbox').addEventListener('click', function(e){ if(e.target.id==='lightbox') closeLightbox(); });
  document.addEventListener('keydown', function(e){
    if(!$('#lightbox').classList.contains('open')) return;
    if(e.key==='Escape') closeLightbox();
    if(e.key==='ArrowLeft') lightboxNav(-1);
    if(e.key==='ArrowRight') lightboxNav(1);
  });
  var touchStartX = null;
  $('#lightbox').addEventListener('touchstart', function(e){ touchStartX = e.touches[0].clientX; }, {passive:true});
  $('#lightbox').addEventListener('touchend', function(e){
    if(touchStartX===null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40) lightboxNav(dx > 0 ? -1 : 1);
    touchStartX = null;
  }, {passive:true});
}

          '<div class="field-error" id="err-url">Введите корректную ссылку.</div></div>'+

        '<div class="field-group switch-row">'+
          '<div><div class="field-label" style="margin-bottom:0;">Published</div><div style="font-size:12px;color:var(--muted-2);">Показывать приложение в каталоге</div></div>'+
          '<label class="switch"><input type="checkbox" id="f-published" '+((editing?editing.published:true)?'checked':'')+'><span class="switch-track"></span></label>'+
        '</div>'+

        '<div class="modal-actions" style="margin-top:22px;">'+
          '<a href="#admin/list" class="btn btn-ghost btn-block" data-link>Отмена</a>'+
          '<button type="button" class="btn btn-outline btn-block" id="f-preview-btn">Предпросмотр</button>'+
          '<button type="submit" class="btn btn-primary btn-block">'+(editing?'Сохранить':'Опубликовать')+'</button>'+
        '</div>'+
      '</form>'+
    '</div>';

  function renderShotGrid(){
    var grid = $('#shot-grid');
    var html = STATE.pendingShots.map(function(s,i){
      return '<div class="shot-item"><img src="'+s+'">'+
        '<button type="button" class="shot-remove" data-remove-shot="'+i+'">✕</button>'+
        '<div class="shot-order">'+
          (i>0?'<button type="button" data-move-shot="'+i+',-1">◀</button>':'')+
          (i<STATE.pendingShots.length-1?'<button type="button" data-move-shot="'+i+',1">▶</button>':'')+
        '</div></div>';
    }).join('');
    if(STATE.pendingShots.length < 10){
      html += '<button type="button" class="shot-add-btn" id="shot-add-btn"><span style="font-size:20px;">+</span>Добавить</button>';
    }
    grid.innerHTML = html;
    $('#shot-count').textContent = STATE.pendingShots.length + ' / 10 изображений';
    var addBtn = $('#shot-add-btn');
    if(addBtn) addBtn.addEventListener('click', function(){ $('#f-shots').click(); });
    $all('[data-remove-shot]', grid).forEach(function(b){
      b.addEventListener('click', function(){ STATE.pendingShots.splice(parseInt(b.getAttribute('data-remove-shot'),10),1); renderShotGrid(); });
    });
    $all('[data-move-shot]', grid).forEach(function(b){
      b.addEventListener('click', function(){
        var parts = b.getAttribute('data-move-shot').split(',');
        var i = parseInt(parts[0],10), dir = parseInt(parts[1],10);
        var j = i + dir;
        if(j<0 || j>=STATE.pendingShots.length) return;
        var tmp = STATE.pendingShots[i]; STATE.pendingShots[i]=STATE.pendingShots[j]; STATE.pendingShots[j]=tmp;
        renderShotGrid();
      });
    });
  }
  renderShotGrid();

  $('#f-icon-btn').addEventListener('click', function(){ $('#f-icon').click(); });
  $('#f-icon').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    if(!/^image\/(png|jpe?g|webp)$/.test(file.type)){ toast('Поддерживаются только PNG, JPG, JPEG, WEBP', 'err'); return; }
    var reader = new FileReader();
    reader.onload = function(ev){
      STATE.pendingIconData = ev.target.result;
      $('#icon-preview').innerHTML = '<img src="'+STATE.pendingIconData+'">';
    };
    reader.readAsDataURL(file);
  });
  var removeIconBtn = $('#f-icon-remove');
  if(removeIconBtn) removeIconBtn.addEventListener('click', function(){ STATE.pendingIconData=null; $('#icon-preview').innerHTML='нет'; });

  $('#f-shots').addEventListener('change', function(e){
    var files = Array.prototype.slice.call(e.target.files);
    var remaining = 10 - STATE.pendingShots.length;
    if(files.length > remaining){
      toast('Можно загрузить максимум 10 изображений.', 'err');
    }
    files = files.slice(0, remaining);
    var loaded = 0;
    if(files.length===0) return;
    files.forEach(function(file){
      if(!/^image\/(png|jpe?g|webp)$/.test(file.type)){ toast('Поддерживаются только PNG, JPG, JPEG, WEBP', 'err'); return; }
      var reader = new FileReader();
      reader.onload = function(ev){
        STATE.pendingShots.push(ev.target.result);
        loaded++;
        if(loaded === files.length){ renderShotGrid(); }
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  });

  function collectFormData(){
    return {
      name: $('#f-name').value.trim(),
      shortDescription: $('#f-short').value.trim(),
      description: $('#f-desc').value.trim(),
      category: $('#f-cat').value,
      tags: $('#f-tags').value.split(',').map(function(t){return t.trim();}).filter(Boolean),
      downloadUrl: $('#f-url').value.trim(),
      published: $('#f-published').checked,
      iconUrl: STATE.pendingIconData,
      screenshots: STATE.pendingShots.slice()
    };
  }
  function validate(data){
    var ok = true;
    ['name','short','desc','url'].forEach(function(k){ $('#err-'+k).classList.remove('show'); $('#f-'+k).classList.remove('invalid'); });
    if(!data.name){ $('#err-name').classList.add('show'); $('#f-name').classList.add('invalid'); ok=false; }
    if(!data.shortDescription){ $('#err-short').classList.add('show'); $('#f-short').classList.add('invalid'); ok=false; }
    if(!data.description){ $('#err-desc').classList.add('show'); $('#f-desc').classList.add('invalid'); ok=false; }
    if(!data.downloadUrl || !isValidUrl(data.downloadUrl)){ $('#err-url').classList.add('show'); $('#f-url').classList.add('invalid'); ok=false; }
    return ok;
  }
  function saveData(data){
    var now = Date.now();
    if(editing){
      Object.assign(editing, data, {updatedAt: now});
    }else{
      STATE.apps.push(Object.assign({id: uid(), createdAt: now, updatedAt: now}, data));
    }
    DB.saveApps(STATE.apps);
  }

  $('#f-preview-btn').addEventListener('click', function(){
    var data = collectFormData();
    if(!validate(data)) return;
    openAppPreview(data, function(){ closeModal(); saveData(data); toast(editing?'✓ Приложение обновлено':'✓ Приложение опубликовано'); navigate('#admin/list'); });
  });

  $('#app-form').addEventListener('submit', function(e){
    e.preventDefault();
    var data = collectFormData();
    if(!validate(data)) return;
    saveData(data);
    toast(editing ? '✓ Приложение обновлено' : '✓ Приложение добавлено');
    navigate('#admin/list');
  });
}
function openAppPreview(data, onPublish){
  var g = gradientFor(data.name||'A');
  openModal(
    '<div class="modal-title">Предпросмотр</div>'+
    '<div class="preview-frame">'+
      '<div class="app-detail-head" style="margin-bottom:14px;">'+
        '<div class="app-detail-icon" style="width:64px;height:64px;'+(data.iconUrl?'':'background:linear-gradient(135deg,'+g[0]+','+g[1]+');display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;')+'">'+
          (data.iconUrl?'<img src="'+data.iconUrl+'">':esc((data.name||'?').charAt(0).toUpperCase()))+
        '</div>'+
        '<div><div style="font-weight:800;font-size:17px;">'+esc(data.name)+'</div><div class="app-cat">'+esc(categoryName(data.category))+'</div></div>'+
      '</div>'+
      '<p style="font-size:13.5px;color:var(--muted);margin-bottom:10px;">'+esc(data.shortDescription)+'</p>'+
      '<p style="font-size:13px;color:var(--muted);line-height:1.6;">'+esc(data.description)+'</p>'+
      (data.screenshots.length?'<div class="gallery-row" style="margin-top:14px;">'+data.screenshots.slice(0,4).map(function(s){return '<div class="gallery-thumb" style="width:110px;height:80px;cursor:default;"><img src="'+s+'"></div>';}).join('')+'</div>':'')+
      '<button class="btn btn-primary btn-block" style="margin-top:16px;" disabled>⚡ Скачать</button>'+
    '</div>'+
    '<div class="modal-actions">'+
      '<button class="btn btn-ghost btn-block" id="prev-back">Назад</button>'+
      '<button class="btn btn-primary btn-block" id="prev-publish">Опубликовать</button>'+
    '</div>'
  );
  $('#prev-back').onclick = closeModal;
  $('#prev-publish').onclick = onPublish;
}

/* ----- 18d. Admin Categories ----- */
function renderAdminCategories(el){
  function draw(){
    el.innerHTML =
      '<div class="admin-panel glass grad-border">'+
        '<div class="panel-head"><div class="panel-title">Категории ('+STATE.categories.length+')</div></div>'+
        '<div class="field-group" style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">'+
          '<div style="flex:1;min-width:160px;"><label class="field-label">Новая категория</label><input class="field-input" id="new-cat-name" placeholder="Название категории"></div>'+
          '<button class="btn btn-primary" id="add-cat-btn">+ Добавить</button>'+
        '</div>'+
        '<div class="admin-table-mobile" style="margin-top:14px;">'+
          STATE.categories.map(function(c){
            var count = STATE.apps.filter(function(a){return a.category===c.id;}).length;
            return '<div class="atm-row"><span class="cat-icon" style="font-size:16px;">'+categoryIcon(c.id)+'</span>'+
              '<div class="atm-info"><div class="atm-name">'+esc(c.name)+'</div><div class="atm-meta">'+count+' приложений</div></div>'+
              '<button class="at-actions-btn" data-del-cat="'+c.id+'">🗑</button></div>';
          }).join('')+
        '</div>'+
      '</div>';
    $('#add-cat-btn').onclick = function(){
      var name = $('#new-cat-name').value.trim();
      if(!name){ toast('Введите название категории', 'err'); return; }
      var id = slugify(name) || uid();
      if(STATE.categories.some(function(c){return c.id===id;})){ toast('Такая категория уже существует', 'err'); return; }
      STATE.categories.push({id:id, name:name});
      DB.saveCategories(STATE.categories);
      toast('✓ Категория добавлена');
      draw();
    };
    $all('[data-del-cat]', el).forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-del-cat');
        var inUse = STATE.apps.some(function(a){return a.category===id;});
        confirmDialog({title:'Удалить категорию?', text: inUse ? 'Эта категория используется в приложениях. Они перейдут в «Другое».' : 'Категория будет удалена.', danger:true}, function(){
          STATE.categories = STATE.categories.filter(function(c){return c.id!==id;});
          STATE.apps.forEach(function(a){ if(a.category===id) a.category='other'; });
          DB.saveCategories(STATE.categories); DB.saveApps(STATE.apps);
          toast('✓ Категория удалена');
          draw();
        });
      });
    });
  }
  draw();
}

/* ----- 18e. Admin Settings ----- */
function renderAdminSettings(el){
  var theme = document.documentElement.getAttribute('data-theme');
  el.innerHTML =
    '<div class="admin-panel glass grad-border">'+
      '<div class="panel-head"><div class="panel-title">Настройки</div></div>'+
      '<div class="field-group switch-row">'+
        '<div><div class="field-label" style="margin-bottom:0;">Тёмная тема</div><div style="font-size:12px;color:var(--muted-2);">Основная тема BUILDORA AI</div></div>'+
        '<label class="switch"><input type="checkbox" id="settings-theme" '+(theme==='dark'?'checked':'')+'><span class="switch-track"></span></label>'+
      '</div>'+
      '<div class="field-group">'+
        '<label class="field-label">Данные (DEMO MODE · localStorage)</label>'+
        '<p style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">Все приложения и категории хранятся локально в этом браузере. Firebase ещё не подключён — см. FIREBASE_CONFIG в коде.</p>'+
        '<button class="btn btn-ghost btn-sm" id="reset-demo-btn">Сбросить к демо-данным</button>'+
      '</div>'+
    '</div>';
  $('#settings-theme').addEventListener('change', function(){ toggleTheme(); });
  $('#reset-demo-btn').addEventListener('click', function(){
    confirmDialog({title:'Сбросить данные?', text:'Все текущие приложения и категории будут заменены демо-данными.', danger:true, okLabel:'Сбросить'}, function(){
      STATE.apps = buildDemoApps();
      STATE.categories = defaultCategories();
      DB.saveApps(STATE.apps); DB.saveCategories(STATE.categories);
      toast('✓ Данные сброшены'); route();
    });
  });
}

/* ---------------------------------------------------------
   19. DRAWER / HEADER / GLOBAL UI WIRING
   --------------------------------------------------------- */
function openDrawer(){ $('#drawer').classList.add('open'); $('#drawer-overlay').classList.add('open'); document.body.style.overflow='hidden'; }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawer-overlay').classList.remove('open'); document.body.style.overflow=''; }

function wireGlobalUI(){
  $('#hamburger-btn').addEventListener('click', openDrawer);
  $('#drawer-close').addEventListener('click', closeDrawer);
  $('#drawer-overlay').addEventListener('click', closeDrawer);
  $('#theme-toggle-btn').addEventListener('click', toggleTheme);
  $('#bn-theme-btn').addEventListener('click', toggleTheme);

  document.addEventListener('click', function(e){
    var link = e.target.closest ? e.target.closest('[data-link]') : null;
    if(link) closeDrawer();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ closeModal(); closeLightbox(); closeDrawer(); }
  });
}

/* ---------------------------------------------------------
   20. PWA INSTALL (Android / desktop Chrome & Edge via
       beforeinstallprompt; manual instructions on iOS Safari,
       which has no install API by OS design)
   ---------------------------------------------------------
   IMPORTANT REAL-WORLD LIMITS (kept here, not just in chat):
   - Browsers only fire "beforeinstallprompt" for pages served
     over HTTPS (or http://localhost) with a registered Service
     Worker + Web App Manifest + icons. Opening this file directly
     as file:// (double-click) will NOT show a native install
     banner in most browsers, because file:// pages cannot
     register a Service Worker. Host it (any static HTTPS host)
     to see the real install prompt on Android/desktop Chrome/Edge.
   - iOS Safari never auto-installs on tap: Apple does not expose
     an install API to websites. The only way to add a PWA to the
     Home Screen on iPhone/iPad is the manual "Share → На экран
     «Домой»" flow, so we detect iOS and show those steps instead
     of pretending a one-tap install exists there.
   --------------------------------------------------------- */
var deferredInstallPrompt = null;
var INSTALL_BANNER_ID = 'pwa-install-banner';

function isIos(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}
function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol === 'file:') return; /* SW registration is blocked on file:// origins */
  var swSource =
    "self.addEventListener('install', function(e){ self.skipWaiting(); });" +
    "self.addEventListener('activate', function(e){ self.clients.claim(); });" +
    "self.addEventListener('fetch', function(e){ e.respondWith(fetch(e.request).catch(function(){ return caches.match(e.request); })); });";
  try{
    var blobUrl = URL.createObjectURL(new Blob([swSource], {type:'application/javascript'}));
    navigator.serviceWorker.register(blobUrl).catch(function(err){ console.warn('SW registration failed:', err); });
  }catch(e){ console.warn('SW registration error:', e); }
}
function showInstallBanner(mode){
  if($('#'+INSTALL_BANNER_ID) || isStandalone()) return;
  var text = mode === 'ios'
    ? 'Нажмите «Поделиться», затем «На экран «Домой»»'
    : 'Установите BUILDORA AI на устройство в один клик';
  var actionBtn = mode === 'ios' ? '' : '<button class="btn btn-primary btn-sm" id="pwa-install-btn">Установить</button>';
  var el = document.createElement('div');
  el.id = INSTALL_BANNER_ID;
  el.className = 'toast';
  el.style.maxWidth = '380px';
  el.innerHTML =
    '<span class="brand-mark" style="width:32px;height:32px;flex-shrink:0;"><img src="'+BRAND_LOGO+'" alt=""></span>'+
    '<span style="flex:1;">'+text+'</span>'+
    actionBtn+
    '<button class="icon-btn" id="pwa-install-dismiss" style="width:28px;height:28px;flex-shrink:0;" aria-label="Скрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
  $('#toast-stack').appendChild(el);
  var installBtn = $('#pwa-install-btn', el);
  if(installBtn){
    installBtn.addEventListener('click', function(){
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function(choice){
        if(choice.outcome === 'accepted') toast('✓ Установка начата');
        deferredInstallPrompt = null;
        el.remove();
      });
    });
  }
  $('#pwa-install-dismiss', el).addEventListener('click', function(){ el.remove(); });
}
function initPwaInstall(){
  registerServiceWorker();
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    showInstallBanner('native');
  });
  window.addEventListener('appinstalled', function(){
    toast('✓ BUILDORA AI установлено на устройство');
    var el = $('#'+INSTALL_BANNER_ID);
    if(el) el.remove();
    deferredInstallPrompt = null;
  });
  /* iOS has no beforeinstallprompt at all — show manual steps once, after a short delay */
  if(isIos() && !isStandalone()){
    setTimeout(function(){ showInstallBanner('ios'); }, 2500);
  }
}

/* ---------------------------------------------------------
   21. INITIALIZATION
   --------------------------------------------------------- */
function init(){
  initTheme();
  var savedApps = DB.loadApps();
  var savedCats = DB.loadCategories();
  STATE.categories = (savedCats && savedCats.length) ? savedCats : defaultCategories();
  STATE.apps = (savedApps && savedApps.length) ? savedApps : buildDemoApps();
  if(!savedApps) DB.saveApps(STATE.apps);
  if(!savedCats) DB.saveCategories(STATE.categories);

  wireGlobalUI();
  wireSearchInputs();
  wireLightboxControls();
  initPwaInstall();
  route();
  document.body.setAttribute('data-page-loaded','true');
}

document.addEventListener('DOMContentLoaded', init);
})();

</script>
